# Do not remember/restore the Bluetooth headset mode (HFP vs A2DP).
#
# WirePlumber was restoring the last headset profile from its state file, so a
# reconnect after a VT switch could bring the headset back in HFP/mSBC mode.
# With persistence off, every connect starts from the normal profile order
# (LDAC/A2DP first).  HFP and mSBC are still available and can be selected
# manually; nothing switches them automatically.

wireplumber.settings = {
  bluetooth.use-persistent-storage = false
}
