# Keep A2DP (high-quality) codecs selected.
# Peak meters / mic probes (pavucontrol, browsers) otherwise flip headsets to HFP
# and the codec "keeps changing" between LDAC/AAC and CVSD/mSBC.
#
# Re-enable headset autoswitch if you need the headset microphone for calls:
#   bluetooth.autoswitch-to-headset-profile = true
#
# IMPORTANT: bluez5.codecs is a whitelist. If set, every codec you want must
# be listed — including HFP codecs (msbc, cvsd). Omitting msbc makes HFP fall
# back to narrowband CVSD only.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.profile-preference = quality
}

monitor.bluez.properties = {
  # Prefer LDAC, then AAC, then high-quality SBC, then plain SBC for A2DP.
  # msbc/cvsd are HFP (headset mic) codecs — not used while on A2DP.
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.codecs = [ ldac aac sbc_xq sbc msbc cvsd ]
}
