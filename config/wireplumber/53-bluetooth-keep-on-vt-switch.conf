# Keep Bluetooth audio alive when the tty2 game session takes the seat.
#
# WirePlumber's logind seat monitoring deactivates the BlueZ monitor whenever
# the graphical session's VT is not the active seat.  Deactivating the monitor
# unregisters the A2DP endpoints, so the headset disconnects and reconnects
# every time tty2 becomes foreground.
#
# This single-user laptop does not need seat gating for Bluetooth, and keeping
# the monitor alive means game audio stays on the headset while playing on tty2.
# The headset also reconnects into the profile saved in WirePlumber's state, so
# it no longer falls back to HFP/mSBC during the reconnect.

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
